<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Project Studio — STORE HUB</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .studio-header {
      height: 60px;
      padding: 0 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .studio-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body style="background:var(--bg-primary); height:100vh; overflow:hidden; display:flex; flex-direction:column;">

  <!-- Studio Topbar -->
  <header class="studio-header">
    <div class="studio-title-group">
      <a href="dashboard.html" class="brand-logo" title="Back to Dashboard">
        <div class="brand-icon" style="width:28px;height:28px;">
          <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </div>
      </a>
      <div style="display:flex; flex-direction:column;">
        <span style="font-weight:700; font-size:1.05rem;" id="editor-project-name">Loading Project...</span>
        <span style="font-size:11px; color:var(--text-muted);">
          Status: <strong id="editor-project-status">Draft</strong> • Store Hub Web Studio
        </span>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn-secondary" onclick="StoreHubProjects.promptNewProject()">+ New Project</button>
      <button id="publish-toggle-btn" class="btn-primary" onclick="StoreHubProjects.togglePublish()">
        Publish Project
      </button>
      <button class="theme-toggle-btn" onclick="StoreHubApp.toggleThemeMode()" title="Toggle theme">
        <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
      <div id="user-profile-widget"></div>
    </div>
  </header>

  <!-- Editor & Preview Split Workspace -->
  <div class="editor-layout" style="margin:12px; height:calc(100vh - 84px); border-radius:var(--radius-md);">
    <!-- Left Files Sidebar -->
    <div class="editor-sidebar">
      <div style="padding:14px 16px; font-weight:700; font-size:0.85rem; border-bottom:1px solid var(--border-color); color:var(--text-muted); text-transform:uppercase;">
        Project Files
      </div>
      <div style="padding:8px;">
        <div class="editor-tab active" data-file="index.html" style="border:none; border-radius:6px; margin-bottom:2px;">
          📄 index.html
        </div>
        <div class="editor-tab" data-file="style.css" style="border:none; border-radius:6px; margin-bottom:2px;">
          🎨 style.css
        </div>
        <div class="editor-tab" data-file="script.js" style="border:none; border-radius:6px; margin-bottom:2px;">
          ⚡ script.js
        </div>
        <div class="editor-tab" data-file="store.js" style="border:none; border-radius:6px; margin-bottom:2px;">
          🚀 store.js (SDK)
        </div>
      </div>

      <div style="margin-top:auto; padding:14px; border-top:1px solid var(--border-color); font-size:11px; color:var(--text-muted);">
        <div><strong>StoreHub SDK v1.0</strong></div>
        <div style="margin-top:4px;">Functions available:</div>
        <code style="color:var(--accent); font-size:10px;">StoreHub.init()<br>StoreHub.project()<br>StoreHub.share()<br>StoreHub.getUser()</code>
      </div>
    </div>

    <!-- Center Code Textarea Editor -->
    <div class="editor-main">
      <div class="editor-tabs">
        <div class="editor-tab active" data-file="index.html">index.html</div>
        <div class="editor-tab" data-file="style.css">style.css</div>
        <div class="editor-tab" data-file="script.js">script.js</div>
        <div class="editor-tab" data-file="store.js">store.js</div>
      </div>

      <textarea id="code-editor-textarea" class="code-textarea" spellcheck="false" placeholder="Write your code here... Changes auto-save in real-time."></textarea>
    </div>

    <!-- Right Live Sandboxed Preview -->
    <div class="preview-pane">
      <div class="preview-toolbar">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">Isolated Sandbox</span>
          <button id="preview-refresh-btn" class="icon-btn" style="width:28px;height:28px;" title="Refresh Preview">
            <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <button id="preview-device-toggle" class="btn-secondary" style="padding:4px 10px; font-size:12px;">💻 Desktop</button>
          <button id="preview-fullscreen-btn" class="btn-secondary" style="padding:4px 10px; font-size:12px;" title="Open in new window">↗ Full</button>
        </div>
      </div>

      <div id="preview-iframe-wrapper" style="flex:1; width:100%; height:100%; transition:all 0.3s ease; overflow:hidden;">
        <iframe id="live-preview-iframe" class="preview-iframe" sandbox="allow-scripts allow-forms allow-modals"></iframe>
      </div>
    </div>
  </div>

  <script src="js/storage-engine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await StoreHubApp.checkAuth();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      StoreHubProjects.init();
    });
  </script>
</body>
</html>
