<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Items — STORE HUB</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .shared-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .shared-tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
    }
    .shared-tab-btn.active {
      background-color: var(--bg-card-hover);
      color: var(--accent);
    }
    .public-box-wrapper {
      max-width: 500px;
      margin: 80px auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <!-- Standard user shell -->
  <div id="standard-shell" class="app-shell" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">
            <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
          </div>
          <span class="brand-name-text">STORE HUB</span>
        </a>
      </div>

      <div class="sidebar-content">
        <div class="nav-group">
          <a href="dashboard.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Home
          </a>
          <a href="drive.html" class="nav-link">
            <svg fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
            My Drive
          </a>
          <a href="shared.html?tab=with_me" class="nav-link active" id="tab-nav-with-me">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            Shared with me
          </a>
          <a href="shared.html?tab=by_me" class="nav-link" id="tab-nav-by-me">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            Shared by me
          </a>
          <a href="public-projects.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
            Public Projects
          </a>
        </div>

        <div class="sidebar-storage">
          <div class="storage-info-header">
            <span style="font-weight:600;">Storage</span>
            <span style="color:var(--accent); font-weight:700;">5 GB Free</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="sidebar-storage-fill" style="width: 0%;"></div>
          </div>
          <div class="storage-detail-text" id="sidebar-storage-text">
            Used: 0 B / 5 GB
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle-btn" id="mobile-menu-btn">
            <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div style="font-weight:700; font-size:1.1rem;">Shared Files</div>
        </div>

        <div class="topbar-right">
          <button class="theme-toggle-btn" onclick="StoreHubApp.toggleThemeMode()" title="Toggle theme">
            <svg style="width:18px;height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
          <div id="user-profile-widget"></div>
        </div>
      </header>

      <main class="page-container">
        <!-- Tabs -->
        <div class="shared-tabs">
          <button class="shared-tab-btn active" id="tab-shared-with-me">Shared with me</button>
          <button class="shared-tab-btn" id="tab-shared-by-me">Shared by me</button>
        </div>

        <!-- Shared Items Container -->
        <div id="shared-list-container"></div>
      </main>
    </div>
  </div>

  <!-- Standalone Public Link Card (when accessing shared.html?s=...) -->
  <div id="public-link-shell" style="display:none; min-height:100vh; background:var(--bg-primary); padding:24px;">
    <div style="text-align:center; padding-top:20px;">
      <a href="index.html" class="brand-logo" style="justify-content:center;">
        <div class="brand-icon">
          <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
        </div>
        <span class="brand-name-text">STORE HUB</span>
      </a>
    </div>

    <div class="public-box-wrapper" id="public-file-card"></div>
  </div>

  <script src="js/storage-engine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/sharing.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      StoreHubSharing.init();
    });
  </script>
</body>
</html>
